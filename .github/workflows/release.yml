name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Wallppr.Tests/Wallppr.Tests.csproj -c Release

      - name: Publish and package
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $publishDir = Join-Path $env:RUNNER_TEMP 'wallppr-publish'
          $asset = Join-Path $env:RUNNER_TEMP "wallppr-$tag-win-x64.zip"

          dotnet publish Wallppr.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $files = @(Get-ChildItem -LiteralPath $publishDir -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Wallppr.exe') {
            throw "Expected only Wallppr.exe, found: $($files.Name -join ', ')"
          }

          Compress-Archive -LiteralPath $files[0].FullName -DestinationPath $asset -CompressionLevel Optimal
          "ASSET_PATH=$asset" >> $env:GITHUB_ENV

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload '${{ github.event.release.tag_name }}' $env:ASSET_PATH --clobber
